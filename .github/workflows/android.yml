name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# The secrets Gradle plugin reads .env at build time. .env is gitignored
# (it holds the publishable key), so CI writes it from a repo secret before
# Gradle runs — otherwise the build silently falls back to .env.example
# placeholders and the APK ships with a dead Supabase client.
env:
  DOTENV_CONTENT: ${{ secrets.DOTENV }}

jobs:
  build:
    name: Build and test debug app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write .env from secret
        run: echo "$DOTENV_CONTENT" > .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoTa-debug-apk
          path: app/build_out/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoTa-unit-test-reports
          path: app/build_out/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write .env from secret
        run: echo "$DOTENV_CONTENT" > .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          ls -la "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NoTa-release-apk
          path: app/build_out/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
